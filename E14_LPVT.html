<!--Informa al navegadoir que el contenido es un archivo HTML-->
<!DOCTYPE html>

<!--Leslie Pamela Velásquez Tzarax, Clave: 29-->

<!--Indica el idioma principal del contenido en la página web-->
<html lang="es">
<!--Cabecera de nuestro archivo HTML-->
<head>
    <!--Define el conjunto de caráceteres especiales-->
    <meta charset="UTF-8">
    <!--controla como sea aplica la página al tamaño de la pantalla del dispositivo-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--Elemento raíz que contiene todo el documento-->
    <title>Lista ordenada</title>
</head>
<!--Cuerpo de nuestro archivo HTML-->
<body>
    <!--título-->
    <h1>Lista no Ordenada</h1>
    <ul>
        <li>C</li>
        <li>C++</li>
        <li>Java</li>
        <li>C#</li>
    </ul>
</body>
</html>
